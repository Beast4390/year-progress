<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>2026 Year Progress Wallpaper</title>

<style>
html,body{
margin:0;
padding:0;
width:100%;
height:100%;
background:#000;
overflow:hidden;
}

body{
display:flex;
justify-content:center;
align-items:center;
}

canvas{
width:auto;
height:100vh;
max-width:100vw;
background:#000;
}
</style>
</head>
<body>

<canvas id="canvas" width="1080" height="2400"></canvas>

<script>
window.onload = function(){

const canvas = document.getElementById("canvas");
const ctx = canvas.getContext("2d");

const YEAR = 2026;
const TOTAL_DAYS = 365;

const quotes = [
"Every day counts.",
"Small steps every day.",
"Discipline beats motivation.",
"No zero days.",
"Your future depends on today.",
"Stay consistent.",
"One day or day one.",
"Progress over perfection.",
"Do it anyway.",
"Be better than yesterday.",
"Dream big. Start small.",
"Success is built daily.",
"Consistency compounds.",
"Keep showing up.",
"The best time is now.",
"Focus on progress.",
"Your habits shape your future.",
"Stay hungry. Stay foolish.",
"Action cures fear.",
"Results come from repetition.",
"Every dot matters.",
"Make today legendary.",
"Win the day.",
"Keep moving forward.",
"Discipline creates freedom.",
"Your future self is watching.",
"Never waste a good day.",
"Done is better than perfect.",
"Great things take time.",
"Trust the process.",
"Keep grinding.",
"Stay focused.",
"Work in silence.",
"Believe in yourself.",
"Be unstoppable.",
"Push your limits.",
"Start before you're ready.",
"Make it happen.",
"Stay patient.",
"Earn your success.",
"Keep learning.",
"Keep building.",
"Stay humble.",
"Stay strong.",
"Stay determined.",
"Success leaves clues.",
"Effort creates opportunities.",
"Your dreams need action.",
"Keep your promises.",
"Master the basics.",
"Growth is daily.",
"Momentum starts today.",
"Never quit early.",
"Outwork yesterday.",
"Stay committed.",
"Create your future.",
"Hard work wins.",
"Consistency wins championships.",
"Be proud of your progress.",
"Turn dreams into plans.",
"Your only competition is yesterday.",
"Stay disciplined.",
"Be relentless.",
"Keep climbing.",
"Keep improving.",
"Stay curious.",
"Focus on what matters.",
"Show up every day.",
"Take the next step.",
"Progress is progress.",
"Keep your standards high.",
"Be obsessed with improvement.",
"Make yourself proud.",
"Don't stop now.",
"Stay on the path.",
"Trust your effort.",
"Choose growth daily.",
"Build better habits.",
"Keep your vision clear.",
"Success is a daily choice.",
"Don't break the chain.",
"Work hard. Stay kind.",
"Focus. Execute. Repeat.",
"Stay in the game.",
"Every rep counts.",
"Every hour matters.",
"Every choice matters.",
"Stay locked in.",
"Small wins become big wins.",
"Keep the promise to yourself.",
"Today's effort is tomorrow's reward.",
"Make progress, not excuses.",
"Become who you admire.",
"Do the hard things first.",
"Success starts with discipline.",
"Keep going. You're closer.",
"Your best days are ahead.",
"Never settle for average.",
"Keep chasing excellence.",
"Make 2026 unforgettable."
];

const today = new Date();
const yearStart = new Date(YEAR,0,1);

let dayIndex = Math.floor((today - yearStart)/86400000);

if(dayIndex < 0) dayIndex = 0;
if(dayIndex > 364) dayIndex = 364;

const completed = dayIndex;
const left = TOTAL_DAYS - completed - 1;
const percent = ((completed/TOTAL_DAYS)*100).toFixed(1);

const quote = quotes[dayIndex % quotes.length];

ctx.fillStyle="#000";
ctx.fillRect(0,0,1080,2400);

ctx.textAlign="center";

ctx.fillStyle="#00ffcc";
ctx.font="bold 90px Arial";
ctx.fillText("2026",540,180);

ctx.fillStyle="#ffffff";
ctx.font="bold 55px Arial";
wrapText(quote,540,420,850,70);

ctx.fillStyle="#00ffcc";
ctx.font="bold 170px Arial";
ctx.fillText(percent+"%",540,900);

ctx.fillStyle="#ffffff";
ctx.font="bold 55px Arial";
ctx.fillText("YEAR COMPLETED",540,1020);

const barWidth=700;
const barHeight=30;
const barX=(1080-barWidth)/2;
const barY=1120;

ctx.fillStyle="#222";
ctx.fillRect(barX,barY,barWidth,barHeight);

ctx.fillStyle="#00ffcc";
ctx.fillRect(
barX,
barY,
(barWidth*completed)/TOTAL_DAYS,
barHeight
);

ctx.fillStyle="#cccccc";
ctx.font="50px Arial";
ctx.fillText(completed+" Days Done",540,1350);

ctx.fillText(left+" Days Left",540,1450);

ctx.fillStyle="#666";
ctx.font="40px Arial";
ctx.fillText("Make Every Day Count",540,2250);

function wrapText(text,x,y,maxWidth,lineHeight){
let words=text.split(" ");
let line="";

for(let n=0;n<words.length;n++){
let testLine=line+words[n]+" ";
let metrics=ctx.measureText(testLine);

if(metrics.width>maxWidth && n>0){
ctx.fillText(line,x,y);
line=words[n]+" ";
y+=lineHeight;
}else{
line=testLine;
}
}
ctx.fillText(line,x,y);
}

};
</script>

</body>
</html>
