    const today = new Date();
    const yearStart = new Date(YEAR, 0, 1);

    let todayIndex = Math.floor((today - yearStart) / 86400000);

    if (todayIndex < 0) todayIndex = 0;
    if (todayIndex > 364) todayIndex = 364;

    const daysCompleted = todayIndex;
    const daysLeft = TOTAL_DAYS - todayIndex - 1;
    const progressPercent = ((daysCompleted / TOTAL_DAYS) * 100).toFixed(1);

    const todayQuote = quotes[todayIndex % quotes.length];

    const todayDate = today.toLocaleDateString("en-US", {
        day: "numeric",
        month: "long",
        year: "numeric"
    });

    /* Background */
    ctx.fillStyle = "#000";
    ctx.fillRect(0, 0, canvas.width, canvas.height);

    /* Title */
    ctx.textAlign = "center";

    ctx.fillStyle = "#00ffcc";
    ctx.font = "bold 72px Arial";
    ctx.fillText(YEAR, canvas.width / 2, 120);

    /* Grid Size */
    const gridWidth =
        (COLUMNS * DOT_SIZE) + ((COLUMNS - 1) * DOT_GAP);

    const gridHeight =
        (ROWS * DOT_SIZE) + ((ROWS - 1) * DOT_GAP);

    const startX = (canvas.width - gridWidth) / 2;
    const startY = 220;

    /* Draw Dots */
    let x = startX;
    let y = startY;
    let col = 0;

    for (let i = 0; i < TOTAL_DAYS; i++) {

        let color = COLOR_FUTURE;

        if (i < todayIndex)
            color = COLOR_PAST;

        if (i === todayIndex)
            color = COLOR_TODAY;

        ctx.beginPath();
        ctx.arc(
            x + DOT_RADIUS,
            y + DOT_RADIUS,
            DOT_RADIUS,
            0,
            Math.PI * 2
        );
        ctx.fillStyle = color;
        ctx.fill();

        col++;
        x += DOT_SIZE + DOT_GAP;

        if (col === COLUMNS) {
            col = 0;
            x = startX;
            y += DOT_SIZE + DOT_GAP;
        }
    }

    /* Text Section */
    const TEXT_START = startY + gridHeight + 80;

    ctx.fillStyle = "#888";
    ctx.font = "34px Arial";
    ctx.fillText(
        todayDate,
        canvas.width / 2,
        TEXT_START
    );

    ctx.fillStyle = "#ffffff";
    ctx.font = "bold 48px Arial";
    ctx.fillText(
        todayQuote,
        canvas.width / 2,
        TEXT_START + 70
    );

    ctx.fillStyle = "#00ffcc";
    ctx.font = "bold 100px Arial";
    ctx.fillText(
        progressPercent + "%",
        canvas.width / 2,
        TEXT_START + 210
    );

    ctx.fillStyle = "#ffffff";
    ctx.font = "bold 40px Arial";
    ctx.fillText(
        "YEAR COMPLETED",
        canvas.width / 2,
        TEXT_START + 270
    );

    /* Progress Bar */
    const barWidth = 700;
    const barHeight = 24;
    const barX = (canvas.width - barWidth) / 2;
    const barY = TEXT_START + 320;

    ctx.fillStyle = "#222";
    ctx.fillRect(
        barX,
        barY,
        barWidth,
        barHeight
    );

    ctx.fillStyle = "#00ffcc";
    ctx.fillRect(
        barX,
        barY,
        (barWidth * daysCompleted) / TOTAL_DAYS,
        barHeight
    );

    ctx.fillStyle = "#aaaaaa";
    ctx.font = "36px Arial";
    ctx.fillText(
        daysCompleted +
        " Days Done  •  " +
        daysLeft +
        " Days Left",
        canvas.width / 2,
        TEXT_START + 400
    );

    ctx.fillStyle = "#555";
    ctx.font = "30px Arial";
    ctx.fillText(
        "Make " + YEAR + " Count",
        canvas.width / 2,
        canvas.height - 80
    );

    /* Auto Export PNG */
    const params = new URLSearchParams(window.location.search);

    if (params.get("export") === "png") {
        const link = document.createElement("a");
        link.download =
            `year-progress-${YEAR}-day-${daysCompleted}.png`;

        link.href =
            canvas.toDataURL("image/png");

        document.body.appendChild(link);
        link.click();
        document.body.removeChild(link);
    }
};
